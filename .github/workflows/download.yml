name: YouTube Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube URL to download'
        required: false
        default: ''
      audio_only:
        description: 'Extract audio only (MP3)'
        type: boolean
        required: false
        default: false
  push:
    paths:
      - 'playlist.txt'

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Prepare download list
        id: prepare
        run: |
          mkdir -p downloads
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.url }}" ]; then
            echo "${{ github.event.inputs.url }}" > /tmp/urls.txt
            echo "SOURCE=manual" >> $GITHUB_OUTPUT
          else
            cp playlist.txt /tmp/urls.txt
            echo "SOURCE=playlist" >> $GITHUB_OUTPUT
          fi
          echo "URL count: $(grep -cv '^\s*$' /tmp/urls.txt || echo 0)"

      - name: Download videos
        run: |
          AUDIO_FLAG=""
          if [ "${{ github.event.inputs.audio_only }}" = "true" ]; then
            AUDIO_FLAG="--extract-audio --audio-format mp3 --audio-quality 0"
          fi
          
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            [[ "$url" =~ ^# ]] && continue
            echo "Downloading: $url"
            yt-dlp \
              $AUDIO_FLAG \
              --no-playlist \
              --output "downloads/%(title)s.%(ext)s" \
              --restrict-filenames \
              "$url" || echo "FAILED: $url" >> downloads/_failed.txt
          done < /tmp/urls.txt
          
          echo "Downloaded files:"
          ls -lh downloads/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youtube-downloads
          path: downloads/
          retention-days: 7
